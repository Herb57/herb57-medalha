<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Herb57 · Medalha e foto</title>
<meta name="description" content="Pegue sua medalha do Quiz do Herb57 e tire sua foto com o Fusca que fala.">
<meta name="theme-color" content="#13203A">
<meta property="og:title" content="Herb57, o Fusca que fala">
<meta property="og:description" content="Medalha do quiz e foto com o Herb57.">
<meta property="og:image" content="https://herb57.github.io/herb57-medalha/img/herb57-por-do-sol.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  /*
   * Herb57 — página da medalha do quiz e da moldura de foto (versão 2).
   * Hospedagem: estática (GitHub Pages). Nada é enviado a servidor: a imagem é
   * montada no próprio celular do visitante.
   * Parâmetros do link (gerados pelo Home Assistant no fim do quiz):
   *   r = acertos, t = total, tema = tema do quiz, ev = evento, hs = hashtag do evento, d = data
   * Sem r/t a página abre direto na moldura de foto (QR impresso).
   */
  :root {
    --ceu: #13203A; --sup: #1C2D4D; --sup2: #243961; --linha: #2E4672;
    --txt: #F4F6F8; --mut: #A8B5CC; --ouro: #F2B33D; --ouro-esc: #2A1C00;
    --nivel: #F2B33D;
    --barra: 84px;
    --acima: 300px;   /* cabeçalho + abas + barra; a página ajusta no modo medalha */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ceu); color: var(--txt);
    font: 400 16px/1.45 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--ouro); outline-offset: 2px; }
  .oculto { display: none !important; }

  /* cabeçalho: a foto do Herb57 no pôr do sol */
  .topo { position: relative; height: 140px; overflow: hidden;
    background: #0E1830 url("img/herb57-por-do-sol.jpg") 30% 62% / cover no-repeat; }
  .topo::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(19,32,58,0) 30%, rgba(19,32,58,.72) 72%, var(--ceu) 100%); }
  .topo .marca { position: absolute; z-index: 1; left: 16px; right: 16px; bottom: 10px;
    display: flex; align-items: center; gap: 12px; max-width: 528px; margin: 0 auto; }
  .selo { flex: none; width: 46px; height: 46px; border-radius: 50%; background: var(--txt); color: var(--ceu);
    border: 3px solid var(--ceu); display: grid; place-items: center; font: 400 23px/1 Anton, sans-serif; }
  .marca h1 { margin: 0; font: 400 28px/1 Anton, sans-serif; letter-spacing: .3px; text-shadow: 0 2px 10px rgba(0,0,0,.5); }
  .marca p { margin: 3px 0 0; font-size: 14px; color: #DCE4F2; text-shadow: 0 1px 6px rgba(0,0,0,.6); }

  main { max-width: 560px; margin: 0 auto; padding: 6px 16px calc(var(--barra) + 28px + env(safe-area-inset-bottom)); }

  /* resultado do quiz */
  .resultado { display: flex; align-items: center; gap: 14px; margin: 4px 0 12px; }
  .placar { flex: none; font: 400 50px/.9 Anton, sans-serif; color: var(--nivel); }
  .placar small { display: block; font: 600 13px/1.2 Inter, sans-serif; color: var(--mut); margin-top: 6px; }
  .resultado h2 { margin: 0; font: 800 17px/1.25 Inter, sans-serif; }
  .resultado p { margin: 3px 0 0; color: var(--mut); font-size: 14px; }

  /* troca medalha / foto */
  .abas { display: grid; grid-template-columns: 1fr 1fr; background: var(--sup); border-radius: 14px; padding: 4px;
    margin-bottom: 12px; }
  .abas button { border: 0; border-radius: 10px; padding: 11px 6px; background: transparent; color: var(--mut);
    font-weight: 600; font-size: 15px; }
  .abas button[aria-selected="true"] { background: var(--sup2); color: var(--txt); box-shadow: inset 0 0 0 1px var(--linha); }

  /* prévia */
  .previa { position: relative; display: grid; place-items: center; margin-bottom: 16px; }
  canvas { display: block; width: auto; height: auto; max-width: 100%; max-height: max(320px, calc(100svh - var(--acima, 300px))); border-radius: 12px;
    background: #0E1830; box-shadow: 0 12px 34px rgba(0,0,0,.45); touch-action: none; }
  .previa.chegou canvas { animation: chega .5s ease-out both; }
  @keyframes chega { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
  .tirar { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); border: 0; border-radius: 999px;
    padding: 15px 22px; background: var(--ouro); color: var(--ouro-esc); font-weight: 800; font-size: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,.45); white-space: nowrap; }

  /* opções */
  .opcoes { display: grid; gap: 14px; margin-bottom: 16px; }
  .campo label, .grupo legend { display: block; font-size: 14px; color: var(--mut); margin: 0 0 6px; padding: 0; }
  .grupo { border: 0; margin: 0; padding: 0; min-width: 0; }
  input[type=text] { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--linha);
    background: var(--sup); font-size: 17px; }
  input[type=text]::placeholder { color: #7184A6; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seg button { border: 1px solid var(--linha); background: var(--sup); border-radius: 12px; padding: 11px 8px;
    font-weight: 600; font-size: 15px; text-align: left; display: flex; align-items: center; gap: 10px; }
  .seg button[aria-pressed="true"] { border-color: var(--ouro); box-shadow: inset 0 0 0 1px var(--ouro); }
  .seg .forma { flex: none; border: 2px solid currentColor; border-radius: 3px; opacity: .8; }
  .zoom { display: flex; align-items: center; gap: 12px; }
  .zoom input { flex: 1; accent-color: var(--ouro); height: 28px; }
  .zoom span { color: var(--mut); font-size: 14px; }
  .dica { color: var(--mut); font-size: 14px; margin: 0; }

  /* depois de compartilhar */
  .depois { border: 1px solid var(--linha); border-radius: 16px; padding: 16px; margin-bottom: 16px; background: var(--sup); }
  .depois h3 { margin: 0 0 4px; font: 400 24px/1.1 Anton, sans-serif; letter-spacing: .3px; }
  .depois p { margin: 0 0 12px; color: var(--mut); font-size: 15px; }
  .depois .acoes-dep { display: grid; gap: 8px; }

  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 14px;
    padding: 15px 14px; font-weight: 800; font-size: 16px; text-decoration: none; text-align: center; }
  .btn.pri { background: var(--ouro); color: var(--ouro-esc); }
  .btn.sec { background: var(--sup2); color: var(--txt); box-shadow: inset 0 0 0 1px var(--linha); }
  .btn:disabled { opacity: .45; }

  /* barra fixa com as ações */
  .barra { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, rgba(19,32,58,0), rgba(19,32,58,.94) 26%, var(--ceu)); }
  .barra .in { max-width: 528px; margin: 0 auto; display: grid; grid-template-columns: 1.6fr 1fr; gap: 8px; }
  .aviso { position: fixed; left: 50%; bottom: calc(var(--barra) + 10px + env(safe-area-inset-bottom)); z-index: 6;
    transform: translateX(-50%); background: var(--txt); color: var(--ceu); font-weight: 600; font-size: 14px;
    padding: 10px 14px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.4); width: max-content; max-width: calc(100% - 32px); }

  footer { color: var(--mut); font-size: 13px; line-height: 1.5; }
  footer a { color: var(--txt); }

  @media (prefers-reduced-motion: reduce) { .previa.chegou canvas { animation: none; } }
</style>
</head>
<body>
<header class="topo">
  <div class="marca">
    <div class="selo" aria-hidden="true">57</div>
    <div>
      <h1>Herb57</h1>
      <p>O Fusca que fala</p>
    </div>
  </div>
</header>

<main>
  <section class="resultado oculto" id="resultado" aria-live="polite">
    <div class="placar" id="placar"></div>
    <div>
      <h2 id="res-titulo"></h2>
      <p id="res-sub"></p>
    </div>
  </section>

  <div class="abas" id="abas" role="tablist" aria-label="O que você quer criar">
    <button id="aba-medalha" role="tab" aria-selected="true">Minha medalha</button>
    <button id="aba-foto" role="tab" aria-selected="false">Foto com o Herb57</button>
  </div>

  <div class="previa" id="previa">
    <canvas id="tela" width="1080" height="1920" role="img" aria-label="Prévia da imagem"></canvas>
    <button class="tirar oculto" id="tirar">📷 Tirar ou escolher foto</button>
  </div>
  <section class="depois oculto" id="depois" aria-live="polite">
    <h3 id="dep-titulo">Pronto!</h3>
    <p id="dep-texto"></p>
    <div class="acoes-dep">
      <button class="btn pri oculto" id="ir-foto">📸 Tirar foto com o Herb57</button>
      <a class="btn sec" href="https://www.instagram.com/fusca.herb57/" rel="noopener">Seguir @fusca.herb57</a>
    </div>
  </section>

  <input id="arquivo" type="file" accept="image/*" class="oculto">

  <section class="opcoes">
    <div class="campo">
      <label for="nome">Seu nome na imagem (opcional)</label>
      <input id="nome" type="text" maxlength="20" placeholder="Ex.: Ana" autocomplete="given-name" enterkeyhint="done">
    </div>
    <fieldset class="grupo">
      <legend>Formato</legend>
      <div class="seg" id="formato">
        <button data-f="story" aria-pressed="true"><span class="forma" style="width:12px;height:20px"></span>Story</button>
        <button data-f="post" aria-pressed="false"><span class="forma" style="width:16px;height:16px"></span>Post</button>
      </div>
    </fieldset>
    <fieldset class="grupo oculto" id="op-moldura">
      <legend>Moldura</legend>
      <div class="seg" id="moldura">
        <button data-m="polaroid" aria-pressed="true">Polaroid</button>
        <button data-m="destaque" aria-pressed="false">Destaque</button>
      </div>
    </fieldset>
    <div class="oculto" id="ajuste-foto">
      <div class="zoom">
        <span>Aproximar</span>
        <input id="zoom" type="range" min="1" max="3" step="0.01" value="1" aria-label="Aproximar a foto">
      </div>
      <p class="dica">Arraste a foto na prévia para enquadrar. <button class="btn-link" id="trocar" style="border:0;background:none;padding:0;color:var(--txt);text-decoration:underline">Trocar foto</button></p>
    </div>
  </section>

  <footer>
    A imagem é criada no seu celular. Nada do que você faz aqui, nem a sua foto, é enviado para a internet.
  </footer>
</main>

<div class="barra" id="barra">
  <div class="in">
    <button class="btn pri" id="compartilhar">Compartilhar</button>
    <button class="btn sec" id="salvar">Salvar</button>
  </div>
</div>
<div class="aviso oculto" id="aviso" role="status"></div>

<script>
(() => {
  // ---------------------------------------------------------------- configuração
  const PERFIL = "@fusca.herb57";
  const HASHTAG_FIXA = "#Herb57";                    // A DEFINIR: hashtag fixa do Fusca
  const FOTO_FUNDO = "img/herb57-por-do-sol.jpg";    // foto do Herb57 no topo da medalha (placa borrada)
  const NIVEIS = [
    { id: "mestre", nome: "Mestre do Fusca Herb57", titulo: ["MESTRE DO FUSCA", "HERB57"], img: "img/medalha-ouro.webp",
      cor: ["#FCE38A", "#E0A526", "#9C6B0C"], texto: "#3A2600", chamada: "Gabaritou!" },
    { id: "especialista", nome: "Especialista do Fusca Herb57", titulo: ["ESPECIALISTA DO", "FUSCA HERB57"], img: "img/medalha-prata.webp",
      cor: ["#F1F4F8", "#BCC5D3", "#7D889B"], texto: "#1A2436", chamada: "Mandou bem!" },
    { id: "amigo", nome: "Amigo do Fusca Herb57", titulo: ["AMIGO DO FUSCA", "HERB57"], img: "img/medalha-azul.webp",
      cor: ["#BFDCFF", "#4C8EF0", "#1E4FB0"], texto: "#0F2A5C", chamada: "Valeu por jogar!" },
  ];
  // posição do disco na imagem da medalha (frações da largura/altura da imagem)
  const DISCO = { cx: 0.5, cy: 0.296, r: 0.5 };
  const COR_FUNDO = "#13203A";

  // ---------------------------------------------------------------- parâmetros
  const P = new URLSearchParams(location.search);
  const limpa = (v, n) => (v || "").replace(/[\u0000-\u001F]/g, "").trim().slice(0, n);
  const r = parseInt(P.get("r"), 10), t = parseInt(P.get("t"), 10);
  const temQuiz = Number.isFinite(r) && Number.isFinite(t) && t > 0 && r >= 0 && r <= t;
  const tema = limpa(P.get("tema"), 50);
  const temaExtra = tema && tema.toLowerCase() !== "fusca" ? tema : "";
  const evento = limpa(P.get("ev"), 90);
  let hsEvento = limpa(P.get("hs"), 40).replace(/\s+/g, "");
  if (hsEvento && !hsEvento.startsWith("#")) hsEvento = "#" + hsEvento;
  const hoje = new Date();
  const data = limpa(P.get("d"), 12) ||
    `${String(hoje.getDate()).padStart(2, "0")}/${String(hoje.getMonth() + 1).padStart(2, "0")}/${hoje.getFullYear()}`;
  const nivel = !temQuiz ? null : (r === t ? NIVEIS[0] : (r / t >= 0.6 ? NIVEIS[1] : NIVEIS[2]));
  const hashtags = [HASHTAG_FIXA, hsEvento].filter(Boolean).join(" ");

  // ---------------------------------------------------------------- estado
  const st = {
    modo: temQuiz ? "medalha" : "foto",
    formato: "story", moldura: "polaroid", nome: "",
    foto: null, zoom: 1, ox: 0, oy: 0,
    fundo: null, medalha: null,
    arquivo: null,                  // imagem pronta para compartilhar (gerada depois de cada desenho)
  };
  try { st.nome = localStorage.getItem("herb57_nome") || ""; } catch (e) {}

  const $ = (id) => document.getElementById(id);
  const tela = $("tela"), ctx = tela.getContext("2d");

  // ---------------------------------------------------------------- utilidades de desenho
  function tam() { return st.formato === "story" ? [1080, 1920] : [1080, 1080]; }
  function ajustaFonte(txt, maxW, base, familia, peso = "") {
    let s = base;
    do { ctx.font = `${peso} ${s}px ${familia}`.trim(); s -= 2; } while (ctx.measureText(txt).width > maxW && s > 12);
    return s + 2;
  }
  function texto(txt, x, y, { tamanho = 40, familia = "Inter", peso = "600", cor = "#fff", alinhar = "center", maxW = 960, sombra = false } = {}) {
    if (!txt) return;
    const s = ajustaFonte(txt, maxW, tamanho, familia, peso);
    ctx.font = `${peso} ${s}px ${familia}`;
    ctx.fillStyle = cor; ctx.textAlign = alinhar; ctx.textBaseline = "middle";
    if (sombra) { ctx.shadowColor = "rgba(0,0,0,.55)"; ctx.shadowBlur = 18; }
    ctx.fillText(txt, x, y);
    ctx.shadowBlur = 0; ctx.shadowColor = "transparent";
  }
  function cobrir(img, x, y, w, h, zoom = 1, ox = 0, oy = 0) {
    const esc = Math.max(w / img.width, h / img.height) * zoom;
    const dw = img.width * esc, dh = img.height * esc;
    const maxX = (dw - w) / 2, maxY = (dh - h) / 2;
    const cx = Math.max(-maxX, Math.min(maxX, ox)), cy = Math.max(-maxY, Math.min(maxY, oy));
    ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    ctx.drawImage(img, x + (w - dw) / 2 + cx, y + (h - dh) / 2 + cy, dw, dh);
    ctx.restore();
    return { maxX, maxY };
  }
  function selo57(cx, cy, raio, fundo = "#fff", cor = COR_FUNDO) {
    ctx.beginPath(); ctx.arc(cx, cy, raio, 0, Math.PI * 2); ctx.fillStyle = fundo; ctx.fill();
    ctx.lineWidth = raio * 0.08; ctx.strokeStyle = cor; ctx.stroke();
    texto("57", cx, cy + raio * 0.05, { tamanho: raio * 1.05, familia: "Anton", peso: "400", cor, maxW: raio * 1.6 });
  }

  // ---------------------------------------------------------------- medalha
  // Story: foto do Herb57 em cima, medalha no meio, títulos embaixo.
  // Post: foto em cima, medalha à esquerda e títulos à direita.
  function desenhaMedalha() {
    const [W, H] = tam(); tela.width = W; tela.height = H;
    const story = st.formato === "story", n = nivel;
    ctx.fillStyle = COR_FUNDO; ctx.fillRect(0, 0, W, H);

    const hFoto = story ? 660 : 450;
    if (st.fundo) {
      cobrir(st.fundo, 0, 0, W, hFoto, 1, 9999, story ? 0 : -9999);
      const g = ctx.createLinearGradient(0, hFoto * 0.45, 0, hFoto);
      g.addColorStop(0, "rgba(19,32,58,0)"); g.addColorStop(1, COR_FUNDO);
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, hFoto + 1);
    }
    selo57(W - (story ? 100 : 80), story ? 100 : 80, story ? 54 : 42, "#ffffff");

    // medalha, com um brilho suave da cor do nível atrás
    const mw = story ? 470 : 340;
    const mx = story ? W / 2 : 270, my = story ? 600 : 400;
    const gy = my + mw * 0.3, brilho = ctx.createRadialGradient(mx, gy, mw * 0.2, mx, gy, mw * 1.1);
    brilho.addColorStop(0, n.cor[1] + "40"); brilho.addColorStop(1, n.cor[1] + "00");
    ctx.fillStyle = brilho; ctx.fillRect(0, my - mw * 0.8, W, mw * 2.2);
    const disco = medalhaEm(mx, my, mw, n);
    texto(`${r}/${t}`, disco.cx, disco.cy - disco.r * 0.08, { tamanho: disco.r * 0.62, familia: "Anton", peso: "400", cor: n.texto, maxW: disco.r * 1.05 });
    texto("ACERTOS", disco.cx, disco.cy + disco.r * 0.36, { tamanho: disco.r * 0.15, peso: "800", cor: n.texto, maxW: disco.r * 0.9 });

    // títulos
    const linhaEvento = [evento || (temaExtra ? "" : "Quiz do Fusca"), data].filter(Boolean).join(", ");
    if (story) {
      let y = 1440;
      texto(n.titulo[0], W / 2, y, { tamanho: 92, familia: "Anton", peso: "400", cor: "#fff", maxW: W - 120 });
      y += 100;
      texto(n.titulo[1], W / 2, y, { tamanho: 92, familia: "Anton", peso: "400", cor: n.cor[0], maxW: W - 120 });
      y += 96;
      if (st.nome) { texto(st.nome, W / 2, y, { tamanho: 82, familia: "Caveat", peso: "700", cor: "#fff", maxW: W - 160 }); y += 74; }
      if (temaExtra) { texto(`Quiz de ${temaExtra}`, W / 2, y, { tamanho: 36, peso: "600", cor: "#DCE4F2", maxW: W - 140 }); y += 46; }
      texto(linhaEvento, W / 2, Math.min(y, 1715), { tamanho: 34, peso: "400", cor: "#A8B5CC", maxW: W - 140 });
    } else {
      const x = 760, mW = 470;
      let y = st.nome ? 520 : 560;
      texto(n.titulo[0], x, y, { tamanho: 62, familia: "Anton", peso: "400", cor: "#fff", maxW: mW });
      y += 70;
      texto(n.titulo[1], x, y, { tamanho: 62, familia: "Anton", peso: "400", cor: n.cor[0], maxW: mW });
      y += 78;
      if (st.nome) { texto(st.nome, x, y, { tamanho: 62, familia: "Caveat", peso: "700", cor: "#fff", maxW: mW }); y += 66; }
      if (temaExtra) { texto(`Quiz de ${temaExtra}`, x, y, { tamanho: 28, peso: "600", cor: "#DCE4F2", maxW: mW }); y += 40; }
      const ev = evento || (temaExtra ? "" : "Quiz do Fusca");
      if (ev) { texto(ev, x, y, { tamanho: 28, peso: "400", cor: "#A8B5CC", maxW: mW }); y += 38; }
      texto(data, x, y, { tamanho: 28, peso: "400", cor: "#A8B5CC", maxW: mW });
    }
    rodape(W, H, story);
  }

  // Desenha a medalha (imagem do nível ou, sem ela, um disco simples) e devolve o disco onde vai o placar.
  function medalhaEm(cx, topo, largura, n) {
    const img = st.medalha;
    if (img) {
      const h = largura * img.height / img.width;
      ctx.save(); ctx.shadowColor = "rgba(0,0,0,.5)"; ctx.shadowBlur = 40; ctx.shadowOffsetY = 12;
      ctx.drawImage(img, cx - largura / 2, topo, largura, h);
      ctx.restore();
      return { cx: cx - largura / 2 + DISCO.cx * largura, cy: topo + DISCO.cy * h, r: DISCO.r * largura * 0.92 };
    }
    const raio = largura / 2, cy = topo + raio;
    ctx.fillStyle = n.cor[2];
    ctx.fillRect(cx - raio * 0.5, cy + raio * 0.6, raio * 0.42, raio * 1.1);
    ctx.fillStyle = n.cor[1];
    ctx.fillRect(cx + raio * 0.08, cy + raio * 0.6, raio * 0.42, raio * 1.1);
    const gm = ctx.createLinearGradient(cx - raio, cy - raio, cx + raio, cy + raio);
    gm.addColorStop(0, n.cor[0]); gm.addColorStop(.5, n.cor[1]); gm.addColorStop(1, n.cor[2]);
    ctx.save(); ctx.shadowColor = "rgba(0,0,0,.5)"; ctx.shadowBlur = 40;
    ctx.beginPath(); ctx.arc(cx, cy, raio, 0, Math.PI * 2); ctx.fillStyle = gm; ctx.fill(); ctx.restore();
    ctx.beginPath(); ctx.arc(cx, cy, raio * 0.82, 0, Math.PI * 2); ctx.lineWidth = raio * 0.05;
    ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.stroke();
    return { cx, cy, r: raio };
  }

  function rodape(W, H, story) {
    const h = story ? 170 : 110;
    ctx.fillStyle = "rgba(0,0,0,.3)"; ctx.fillRect(0, H - h, W, h);
    selo57(story ? 110 : 80, H - h / 2, story ? 50 : 34);
    const x = story ? 186 : 132;
    texto(PERFIL, x, H - h / 2 - (story ? 22 : 14), { tamanho: story ? 50 : 34, peso: "800", cor: "#fff", alinhar: "left", maxW: W - x - 50 });
    texto(`O Fusca que fala  ${hashtags}`.trim(), x, H - h / 2 + (story ? 30 : 20), { tamanho: story ? 30 : 22, peso: "400", cor: "#C8D3EA", alinhar: "left", maxW: W - x - 50 });
  }

  // ---------------------------------------------------------------- moldura de foto
  let limites = { maxX: 0, maxY: 0 };
  function desenhaFoto() {
    const [W, H] = tam(); tela.width = W; tela.height = H;
    const story = st.formato === "story";
    const frase = st.nome ? `${st.nome} conheceu o Herb57!` : "Eu conheci o Herb57!";
    const linhaEvento = [evento, data].filter(Boolean).join(", ");
    if (st.moldura === "polaroid") {
      ctx.fillStyle = "#F6F3EC"; ctx.fillRect(0, 0, W, H);
      const m = story ? 64 : 54;
      const base = story ? 430 : 230;
      const area = { x: m, y: m, w: W - 2 * m, h: H - m - base };
      ctx.fillStyle = "#D9D4C8"; ctx.fillRect(area.x, area.y, area.w, area.h);
      if (st.foto) limites = cobrir(st.foto, area.x, area.y, area.w, area.h, st.zoom, st.ox, st.oy);
      const yb = area.y + area.h;
      texto(frase, W / 2, yb + (story ? 120 : 78), { tamanho: story ? 104 : 74, familia: "Caveat", peso: "700", cor: "#1F2937", maxW: W - 2 * m - 40 });
      texto(linhaEvento, W / 2, yb + (story ? 222 : 140), { tamanho: story ? 36 : 28, peso: "600", cor: "#4B5563", maxW: W - 2 * m - 40 });
      texto(`${PERFIL}  ${hashtags}`.trim(), W / 2, yb + (story ? 300 : 192), { tamanho: story ? 36 : 28, peso: "800", cor: "#2563EB", maxW: W - 2 * m - 40 });
      selo57(W - m - (story ? 70 : 52), area.y + (story ? 70 : 52), story ? 54 : 40, "#ffffff");
    } else {
      ctx.fillStyle = COR_FUNDO; ctx.fillRect(0, 0, W, H);
      if (st.foto) limites = cobrir(st.foto, 0, 0, W, H, st.zoom, st.ox, st.oy);
      const g = ctx.createLinearGradient(0, H * (story ? 0.58 : 0.45), 0, H);
      g.addColorStop(0, "rgba(10,16,30,0)"); g.addColorStop(1, "rgba(10,16,30,.92)");
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      const tg = ctx.createLinearGradient(0, 0, 0, 220);
      tg.addColorStop(0, "rgba(10,16,30,.55)"); tg.addColorStop(1, "rgba(10,16,30,0)");
      ctx.fillStyle = tg; ctx.fillRect(0, 0, W, 220);
      if (hashtags) texto(hashtags, 54, 80, { tamanho: 36, peso: "800", cor: "#fff", alinhar: "left", maxW: W - 220, sombra: true });
      selo57(W - 110, 110, story ? 62 : 52, "#ffffff");
      let y = H - (story ? 470 : 330);
      texto(st.nome ? st.nome.toUpperCase() : "EU CONHECI", W / 2, y, { tamanho: story ? 120 : 92, familia: "Anton", peso: "400", cor: "#fff", maxW: W - 120, sombra: true });
      y += story ? 130 : 96;
      texto(st.nome ? "CONHECEU O HERB57" : "O HERB57", W / 2, y, { tamanho: story ? 120 : 92, familia: "Anton", peso: "400", cor: "#F2B33D", maxW: W - 120, sombra: true });
      y += story ? 110 : 80;
      texto(linhaEvento, W / 2, y, { tamanho: story ? 38 : 30, peso: "600", cor: "#E2E8F5", maxW: W - 140, sombra: true });
      y += story ? 70 : 52;
      texto(PERFIL, W / 2, y, { tamanho: story ? 50 : 38, peso: "800", cor: "#fff", maxW: W - 140, sombra: true });
    }
  }

  // ---------------------------------------------------------------- desenhar e preparar o arquivo
  // O arquivo é gerado logo depois de cada desenho: assim o toque em Compartilhar chama o
  // compartilhamento na hora (o Safari recusa se houver espera longa entre o toque e o share).
  let espera = null, geracao = 0;
  function desenha() {
    (st.modo === "medalha" ? desenhaMedalha : desenhaFoto)();
    st.arquivo = null;
    const minha = ++geracao;
    clearTimeout(espera);
    espera = setTimeout(() => {
      if (!pronto()) return;
      tela.toBlob((b) => { if (b && minha === geracao) st.arquivo = new File([b], nomeArq(), { type: "image/jpeg" }); }, "image/jpeg", 0.92);
    }, 250);
  }
  const pronto = () => st.modo === "medalha" || !!st.foto;

  // ---------------------------------------------------------------- interface
  function aplicaModo() {
    const med = st.modo === "medalha";
    $("aba-medalha").setAttribute("aria-selected", med);
    $("aba-foto").setAttribute("aria-selected", !med);
    $("op-moldura").classList.toggle("oculto", med);
    $("ajuste-foto").classList.toggle("oculto", med || !st.foto);
    $("tirar").classList.toggle("oculto", med || !!st.foto);
    $("resultado").classList.toggle("oculto", !med);
    $("ir-foto").classList.toggle("oculto", !med);
    $("depois").classList.add("oculto");
    document.documentElement.style.setProperty("--acima", med ? "370px" : "290px");
    tela.setAttribute("aria-label", med ? `Prévia da medalha: ${nivel.nome}, ${r} de ${t} acertos` : "Prévia da foto com o Herb57");
    atualizaBotoes();
    desenha();
  }
  function atualizaBotoes() {
    const ok = pronto();
    $("compartilhar").textContent = ok ? "Compartilhar" : "📷 Tirar foto";
    $("salvar").disabled = !ok;
  }
  function aviso(msg) {
    const a = $("aviso"); a.textContent = msg; a.classList.remove("oculto");
    clearTimeout(aviso.t); aviso.t = setTimeout(() => a.classList.add("oculto"), 3500);
  }
  function mostraDepois(acao) {
    const med = st.modo === "medalha";
    $("dep-titulo").textContent = acao === "salvou" ? "Imagem salva!" : "Pronto!";
    $("dep-texto").textContent = med
      ? "Agora que tal uma foto sua com o Herb57? Ela já sai com a moldura, é só tirar e postar."
      : `Marque ${PERFIL} quando postar, o Herb57 adora ver as fotos.`;
    $("depois").classList.remove("oculto");
    setTimeout(() => $("depois").scrollIntoView({ behavior: "smooth", block: "center" }), 150);
  }

  // resultado do quiz (texto na página, igual ao da medalha)
  if (temQuiz) {
    document.documentElement.style.setProperty("--nivel", nivel.cor[0]);
    $("placar").innerHTML = `${r}<span style="opacity:.55">/${t}</span><small>acertos</small>`;
    $("res-titulo").textContent = `${nivel.chamada} Você é ${nivel.nome}.`;
    $("res-sub").textContent = [temaExtra ? `Quiz de ${temaExtra}` : "Quiz do Fusca", evento].filter(Boolean).join(", ");
  } else {
    $("abas").classList.add("oculto");
  }

  $("aba-medalha").onclick = () => { st.modo = "medalha"; aplicaModo(); };
  $("aba-foto").onclick = () => { st.modo = "foto"; aplicaModo(); };
  $("nome").value = st.nome;
  $("nome").oninput = (e) => {
    st.nome = limpa(e.target.value, 20);
    try { localStorage.setItem("herb57_nome", st.nome); } catch (err) {}
    desenha();
  };
  $("nome").onkeydown = (e) => { if (e.key === "Enter") e.target.blur(); };
  const grupo = (sel, chave, campo) => document.querySelectorAll(sel).forEach((b) => b.onclick = () => {
    st[campo] = b.dataset[chave]; st.ox = st.oy = 0;
    document.querySelectorAll(sel).forEach((x) => x.setAttribute("aria-pressed", x === b));
    desenha();
  });
  grupo("#formato button", "f", "formato");
  grupo("#moldura button", "m", "moldura");

  // foto: câmera ou galeria (reduzida para no máximo 2400 px, para arrastar sem travar)
  const escolher = () => $("arquivo").click();
  $("tirar").onclick = escolher;
  $("trocar").onclick = escolher;
  $("ir-foto").onclick = () => { st.modo = "foto"; aplicaModo(); window.scrollTo({ top: 0, behavior: "smooth" }); escolher(); };
  $("arquivo").onchange = (e) => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const url = URL.createObjectURL(f);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 2400 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      st.foto = c; st.zoom = 1; st.ox = st.oy = 0; $("zoom").value = 1;
      e.target.value = "";
      aplicaModo();
    };
    img.onerror = () => { URL.revokeObjectURL(url); aviso("Não deu para abrir essa foto. Tente outra."); };
    img.src = url;
  };
  $("zoom").oninput = (e) => { st.zoom = parseFloat(e.target.value); desenha(); };

  // arrastar para enquadrar (com pinça de dois dedos para zoom)
  const toques = new Map(); let dist0 = 0, zoom0 = 1;
  const escala = () => tela.width / tela.getBoundingClientRect().width;
  tela.addEventListener("pointerdown", (e) => { if (st.modo !== "foto" || !st.foto) return;
    tela.setPointerCapture(e.pointerId); toques.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (toques.size === 2) { const [a, b] = [...toques.values()]; dist0 = Math.hypot(a.x - b.x, a.y - b.y); zoom0 = st.zoom; } });
  tela.addEventListener("pointermove", (e) => { if (!toques.has(e.pointerId)) return;
    const ant = toques.get(e.pointerId); toques.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (toques.size === 1) {
      const k = escala();
      st.ox = Math.max(-limites.maxX, Math.min(limites.maxX, st.ox + (e.clientX - ant.x) * k));
      st.oy = Math.max(-limites.maxY, Math.min(limites.maxY, st.oy + (e.clientY - ant.y) * k));
    } else if (toques.size === 2 && dist0) {
      const [a, b] = [...toques.values()];
      st.zoom = Math.max(1, Math.min(3, zoom0 * Math.hypot(a.x - b.x, a.y - b.y) / dist0)); $("zoom").value = st.zoom;
    }
    desenha(); });
  const solta = (e) => { toques.delete(e.pointerId); if (toques.size < 2) dist0 = 0; };
  tela.addEventListener("pointerup", solta); tela.addEventListener("pointercancel", solta);

  // compartilhar / salvar
  const nomeArq = () => `herb57-${st.modo}-${st.formato}.jpg`;
  const legenda = () => (st.modo === "medalha"
    ? `Fiz o Quiz do Fusca e virei ${nivel.nome}! ${PERFIL} ${hashtags}`
    : `Conheci o Herb57, o Fusca que fala! ${PERFIL} ${hashtags}`).trim();
  const gerar = () => st.arquivo ? Promise.resolve(st.arquivo)
    : new Promise((ok) => tela.toBlob((b) => ok(new File([b], nomeArq(), { type: "image/jpeg" })), "image/jpeg", 0.92));
  function baixar(arq) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(arq); a.download = arq.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }
  $("salvar").onclick = async () => {
    if (!pronto()) return escolher();
    baixar(await gerar());
    mostraDepois("salvou");
  };
  $("compartilhar").onclick = async () => {
    if (!pronto()) return escolher();
    // a legenda vai para a área de transferência (o Instagram não recebe texto junto com a imagem)
    try { navigator.clipboard.writeText(legenda()).then(() => aviso("Legenda copiada. Cole ao postar."), () => {}); } catch (e) {}
    const arq = await gerar();
    if (navigator.canShare && navigator.canShare({ files: [arq] })) {
      try { await navigator.share({ files: [arq] }); mostraDepois("compartilhou"); return; }
      catch (e) { if (e && e.name === "AbortError") return; }
    }
    baixar(arq);
    mostraDepois("salvou");
  };

  // ---------------------------------------------------------------- início
  const carrega = (src, campo) => { const i = new Image(); i.onload = () => { st[campo] = i; desenha(); }; i.src = src; };
  carrega(FOTO_FUNDO, "fundo");
  if (nivel) carrega(nivel.img, "medalha");
  const fontes = ["400 40px Anton", "700 40px Caveat", "600 40px Inter", "800 40px Inter"];
  Promise.all(fontes.map((f) => document.fonts.load(f).catch(() => null))).finally(desenha);
  aplicaModo();
  $("previa").classList.add("chegou");
})();
</script>
</body>
</html>
